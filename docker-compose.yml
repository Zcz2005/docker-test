services:
  southnotary-uploader:
    build: .
    container_name: southnotary-uploader
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      # Mount the directory that contains recorded videos on the host.
      - /data/recordings:/data/recordings:ro
